[project]
name = "winpot-bot"
version = "0.1.0"
description = "Winpot Telegram browser automation bot with persistent profiles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28,<1",
    "playwright>=1.49,<2",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=21.0,<23",
]

[project.scripts]
winpot-bot = "winpot_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["winpot_bot", "jev_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13", "pyinstaller>=6.0,<7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
