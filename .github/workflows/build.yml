name: Build & Release Executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            src_name: dist/winpot-bot
            asset_name: winpot-bot-linux
          - os: macos-latest
            src_name: dist/winpot-bot
            asset_name: winpot-bot-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Write .env from repository secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ACCESS_URL: ${{ secrets.ACCESS_URL }}
        run: |
          uv run python -c "import os; open('.env', 'w', encoding='utf-8').write(f'TELEGRAM_BOT_TOKEN={os.environ.get(\"TELEGRAM_BOT_TOKEN\", \"\")}\nACCESS_URL={os.environ.get(\"ACCESS_URL\", \"\")}\n')"

      - name: Build executable
        run: uv run python build_exe.py

      - name: Rename binary for release
        run: |
          uv run python -c "import os; os.replace('${{ matrix.src_name }}', 'dist/${{ matrix.asset_name }}')"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Latest Build (#{0})', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/winpot-bot-linux
            release-assets/winpot-bot-macos
