name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: winpot-bot-linux
          # - os: macos-latest
          #   artifact: winpot-bot-macos
          # - os: windows-latest
          #   artifact: winpot-bot-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Write .env from repository secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ACCESS_URL: ${{ secrets.ACCESS_URL }}
        run: |
          uv run python -c "import os; open('.env', 'w', encoding='utf-8').write(f'TELEGRAM_BOT_TOKEN={os.environ.get(\"TELEGRAM_BOT_TOKEN\", \"\")}\nACCESS_URL={os.environ.get(\"ACCESS_URL\", \"\")}\n')"

      - name: Build executable
        run: uv run python build_exe.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/winpot-bot*
